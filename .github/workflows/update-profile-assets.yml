name: Update profile assets

on:
  schedule:
    # Once a day, 03:17 UTC (off the hour to avoid GitHub's scheduled-job pile-up)
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          python3 generate_analytics.py --username Neha501 --out ../assets/generated/analytics.svg

      - name: Generate contribution runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          python3 generate_contribution.py --username Neha501 --out ../assets/generated/contribution-animation.svg

      - name: Generate analytics dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          python3 generate_dashboard.py --username Neha501 --outdir ../assets/generated

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Neha501
          outputs: |
            assets/generated/github-contribution-grid-snake.svg
            assets/generated/github-contribution-grid-snake-dark.svg?palette=github-dark
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/analytics.svg \
                  assets/generated/contribution-animation.svg \
                  assets/generated/github-contribution-grid-snake.svg \
                  assets/generated/github-contribution-grid-snake-dark.svg \
                  assets/generated/contribution-trend.svg \
                  assets/generated/weekly-pattern.svg \
                  assets/generated/monthly-contributions.svg \
                  assets/generated/repository-activity.svg \
                  assets/generated/language-distribution.svg \
                  assets/generated/repository-growth.svg \
                  assets/generated/commit-heatmap.svg
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh profile assets and snake"
          git push
