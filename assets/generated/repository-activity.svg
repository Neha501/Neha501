<svg viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository Activity">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#010409" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="blueArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58A6FF"  stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#58A6FF"  stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="greenArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3FB950" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="860" height="230" rx="12" fill="#161B22" filter="url(#shadow)"/>
  <rect x="0.5" y="0.5" width="859" height="229" rx="12" fill="none" stroke="#30363D" stroke-opacity="0.7"/>
  <text x="24" y="30" font-size="13" font-weight="600" fill="#C9D1D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Repository Activity</text>
  <text x="24" y="46" font-size="10" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Live stats · GitHub REST API</text>
  <text x="180" y="87.0" font-size="11.5" fill="#C9D1D9" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Total Contributions</text>
  <rect x="190" y="66.0" width="620" height="32" rx="6" fill="#30363D" opacity="0.25"/>
  <rect x="190" y="66.0" width="589.0" height="32" rx="6" fill="#58A6FF" opacity="0.88">
    <animate attributeName="width" from="0" to="589.0" dur="1s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="789.0" y="87.0" font-size="12" font-weight="600" fill="#58A6FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">84</text>
  <text x="180" y="124.5" font-size="11.5" fill="#C9D1D9" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pull Requests</text>
  <rect x="190" y="103.5" width="620" height="32" rx="6" fill="#30363D" opacity="0.25"/>
  <rect x="190" y="103.5" width="7.0" height="32" rx="6" fill="#BC8CFF" opacity="0.88">
    <animate attributeName="width" from="0" to="7.0" dur="1s" begin="0.14s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="207.0" y="124.5" font-size="12" font-weight="600" fill="#BC8CFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">1</text>
  <text x="180" y="162.0" font-size="11.5" fill="#C9D1D9" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Issues Opened</text>
  <rect x="190" y="141.0" width="620" height="32" rx="6" fill="#30363D" opacity="0.25"/>
  <rect x="190" y="141.0" width="0.0" height="32" rx="6" fill="#F78166" opacity="0.88">
    <animate attributeName="width" from="0" to="0.0" dur="1s" begin="0.28s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="200.0" y="162.0" font-size="12" font-weight="600" fill="#F78166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0</text>
  <text x="180" y="199.5" font-size="11.5" fill="#C9D1D9" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Stars Earned</text>
  <rect x="190" y="178.5" width="620" height="32" rx="6" fill="#30363D" opacity="0.25"/>
  <rect x="190" y="178.5" width="49.1" height="32" rx="6" fill="#E3B341" opacity="0.88">
    <animate attributeName="width" from="0" to="49.1" dur="1s" begin="0.42s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="249.1" y="199.5" font-size="12" font-weight="600" fill="#E3B341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">7</text>

</svg>
