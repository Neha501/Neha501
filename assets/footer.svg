<svg viewBox="0 0 700 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer sprout detail">
  <defs>
    <style>
      .leaf { transform-origin: 350px 40px; animation: sway 4s ease-in-out infinite; }
      @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    </style>
  </defs>
  <text x="350" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="11" fill="#657267">Thanks for stopping by</text>
  <g class="leaf">
    <path d="M350,40 Q344,28 350,18 Q356,28 350,40 Z" fill="#83B547"/>
    <line x1="350" y1="40" x2="350" y2="18" stroke="#5F963B" stroke-width="1"/>
  </g>
</svg>
